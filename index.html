<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Calculator</title>
<meta name="description" content="A phone-style calculator you can also speak to.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calc" aria-label="Calculator">

    <output class="screen" id="screen">
      <span class="screen__sub" id="sub" aria-hidden="true"></span>
      <span class="screen__main" id="display">0</span>
    </output>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="pad">
      <button class="key key--fn"  data-key="C" aria-label="Clear">C</button>
      <button class="key key--fn"  data-key="<" aria-label="Backspace">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9L2 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="key key--mic" data-key="mic" id="mic" aria-label="Speak an expression">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="key key--op"  data-key="/" aria-label="Divide">÷</button>

      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key--op" data-key="*" aria-label="Multiply">×</button>

      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key key--op" data-key="-" aria-label="Subtract">−</button>

      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key key--op" data-key="+" aria-label="Add">+</button>

      <button class="key key--wide" data-key="0">0</button>
      <button class="key" data-key="." aria-label="Decimal point">.</button>
      <button class="key key--eq" data-key="=" aria-label="Equals">=</button>
    </div>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
